# CI/CD Pipeline — Runs automated tests on every push and pull request.
# Ensures that all unit and integration tests pass before code is merged.

name: FitTrack Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v
